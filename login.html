<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Entrar · Painel de Manutenção da Frota</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#002D62 0%,#003C80 60%,#002D62 100%);color:#2B2B2B}
form{background:#fff;border-radius:16px;padding:28px 26px;width:min(350px,92vw);border-top:5px solid #FF6600;box-shadow:0 20px 50px rgba(0,0,0,.35)}
h1{font-size:19px;margin:0 0 4px;color:#002D62}h1:before{content:"✔";color:#FF6600;margin-right:8px;font-weight:900}p{color:#5f6b7a;font-size:13px;margin:0 0 16px}
label{display:block;font-size:12px;color:#5f6b7a;margin:12px 0 4px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #E0E0E0;border-radius:8px;background:#F5F5F5;color:#2B2B2B;font-size:15px}input:focus{outline:2px solid #FF6600;outline-offset:-1px;background:#fff}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:#FF6600;color:#fff;font-size:15px;font-weight:700;cursor:pointer}button:hover{background:#F26522}#e{color:#d32f2f;font-size:13px;min-height:18px;margin-top:10px}</style></head>
<body><form id="f"><h1>Painel de Manutenção da Frota</h1><p>Entre com seu usuário e senha.</p><label>Usuário</label><input id="u" autocomplete="username" autofocus><label>Senha</label><input id="s" type="password" autocomplete="current-password"><button>Entrar</button><div id="e"></div></form>
<script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();const E=document.getElementById("e");E.textContent="";try{const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({user:document.getElementById("u").value,pass:document.getElementById("s").value})});const j=await r.json();if(r.ok)location.href="/";else E.textContent=j.erro||"Não foi possível entrar."}catch(x){E.textContent="Servidor indisponível."}}</script></body></html>
